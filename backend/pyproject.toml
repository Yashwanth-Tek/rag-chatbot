[project]
name = "rag-chatbot-backend"
version = "0.1.0"
description = "Closed-domain RAG chatbot API"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.10.0",
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--import-mode=importlib -m 'not live'"
markers = ["live: calls the real Ollama and Anthropic services (slow, costs tokens)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
